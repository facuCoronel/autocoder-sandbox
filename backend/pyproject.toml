[project]
name = "autocoder-sandbox-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

